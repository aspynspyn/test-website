<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동물상 테스트</title>
  <meta name="description" content="눈매, 코, 얼굴형으로 알아보는 나의 동물상">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <span class="logo">동물상 테스트</span>
    <button id="theme-toggle" aria-label="테마 전환">🌙</button>
  </header>

  <main>
    <section id="start" class="screen center">
      <div id="animal-preview" class="preview"></div>
      <h1>나는 어떤 동물상일까?</h1>
      <p class="sub">눈매, 콧망울, 얼굴형으로 알아보는 7문항 테스트</p>
      <button id="start-btn" class="btn">테스트 시작하기</button>
      <p class="note">거울을 보면서 하면 더 정확해요 🪞</p>
    </section>

    <section id="quiz" class="screen" hidden>
      <div class="progress">
        <button id="back-btn" class="back" aria-label="이전 문항">←</button>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text" class="progress-text"></span>
      </div>
      <h2 id="question" class="question"></h2>
      <div id="options" class="options"></div>
    </section>

    <section id="result" class="screen center" hidden>
      <p class="sub">당신의 동물상은</p>
      <div id="result-emoji" class="result-emoji"></div>
      <h1 id="result-name"></h1>
      <div id="result-tags" class="tags"></div>
      <p id="result-desc" class="result-desc"></p>
      <div class="card">
        <h3>✨ 내 인상 살리는 메이크업 포인트</h3>
        <p id="makeup-summary" class="makeup-summary"></p>
        <div id="makeup-points"></div>
      </div>
      <div class="card">
        <h3>동물상 비율</h3>
        <div id="result-bars"></div>
      </div>
      <div class="actions">
        <button id="share-btn" class="btn">친구에게 공유하기</button>
        <button id="retry-btn" class="btn ghost">다시 하기</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>재미로 보는 테스트예요. 외모를 평가하지 않아요.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
